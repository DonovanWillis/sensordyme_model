name: SensorDyme
options:
  bundleIdPrefix: com.sensordyme
  deploymentTarget:
    iOS: "17.0"
targets:
  SensorDyme:
    type: application
    platform: iOS
    sources:
      - Sources
      - Assets.xcassets
    info:
      path: Info.plist
      properties:
        UILaunchScreen: {}
        # From build settings, not literals, so a build can be identified on a
        # phone: `xcrun devicectl device info apps` reports exactly these. Every
        # build used to say 1.0 (1), which could not tell an old install from one
        # built from this repository.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Where this build's backend lives. Empty by default: no domain is
        # assumed, and an unset build setting expands to "" which the app reads
        # as "not configured" and falls back to mDNS discovery on the LAN — the
        # existing development behaviour, unchanged. Set SENSORDYME_API_BASE_URL
        # (below, in an .xcconfig, or on the xcodebuild command line) to a
        # deployed HTTPS URL and the app works from any network, with discovery
        # demoted to a fallback it can never override. See BackendResolution.swift.
        SDBackendBaseURL: $(SENSORDYME_API_BASE_URL)
        # Plain HTTP must reach LAN IP literals, and ATS has no key for that:
        # NSAllowsLocalNetworking covers .local and unqualified names only, and was
        # MEASURED to block http://11.33.6.234 — this network's real addresses, which
        # are not RFC 1918 (ResNet-style networks hand out public-range space). So the
        # exemption stays, and the actual rule is enforced in the app where
        # credentials leave it: BackendResolution.cleartextPermitted refuses plain
        # HTTP to any internet DNS name (APIClient, Manual server address).
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        # Local-network + Bonjour: the device dashboard (_sensordyme._tcp, published by
        # scripts/publish_mdns.py) and the cloud backend (_sensordyme-api._tcp, published
        # by cloud/mdns.py) — the latter is how sign-in works without anyone typing an
        # address. iOS returns nothing for a service type that is not declared here, and
        # says nothing about why, so this list must stay in step with both publishers.
        NSLocalNetworkUsageDescription: SensorDyme finds your device and your server on your Wi-Fi, so you can sign in and see the live feed without typing an address.
        NSBonjourServices: [_sensordyme._tcp, _sensordyme-api._tcp]
        # Bluetooth: provisioning the device's Wi-Fi when it has no network yet
        NSBluetoothAlwaysUsageDescription: SensorDyme uses Bluetooth to set up your device's Wi-Fi connection.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sensordyme.app
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1" # override per build, e.g. CURRENT_PROJECT_VERSION=20261014.2230
        SWIFT_VERSION: "5.9"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: D6ZR59ZR7Q # personal team set in Xcode; kept here so regeneration preserves it
        # The one place the production backend hostname is configured. Empty
        # until a backend is actually deployed — deliberately not a literal in
        # Swift, and deliberately not a guessed domain.
        #
        # Leave it EMPTY for Mac development. A LAN IP here is the one thing that
        # reliably breaks this app: it was set to http://11.22.7.64:8787, which
        # names a network this Mac has since left, and because a build-time URL
        # outranks discovery the app went on trying that dead address and could
        # not be pointed anywhere else without editing this file and rebuilding.
        # Empty means "find the Mac on the network", which is the behaviour that
        # survives a DHCP move. Set this only to a real deployed HTTPS URL.
        SENSORDYME_API_BASE_URL: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
