# SensorDyme configuration
# Switch products by changing ONE line: `module`.
module: driver_attention

# profile: pi (default) | mac_max
#   pi      -- the shipping product: nano models, config under `modules:` below.
#              This is what setup_pi.sh deploys and what runs on the Raspberry Pi.
#   mac_max -- an ADDITIVE, Mac-only high-accuracy profile (config under `mac_max:`
#              below). It requires Apple Silicon + torch MPS and refuses to start
#              otherwise. It exists for demos, generating ground-truth comparisons,
#              and a GPU-backed accuracy ceiling -- it is NOT the shipping product.
#              Selecting it never reads or affects anything under `modules:`.
profile: pi

# Show a live debug window (face mesh / boxes / skeleton + red full-screen alert
# flash). Great for Mac development; set to false for a headless Pi service.
display: true

camera:
  width: 640
  height: 480
  fps: 30
  device_index: 0 # cv2.VideoCapture index — only used in Mac/dev mode
  rotate_180: false # true when the device is mounted upside down (flipped at the sensor on the Pi — no CPU cost)

# Drive Dashboard: the device serves a local web app with the live annotated
# feed, a big status card, a real-time alert timeline, and session analytics. Works with
# every module (dev-max, dev-openpilot, dev-dashsentinel, ...). Open the URL printed at
# startup (default http://localhost:8899).
# PRIVACY: annotated frames stream in-memory over HTTP to connected browsers only --
# never written to disk. host 127.0.0.1 = this machine only; set 0.0.0.0 on the Pi to
# view from your phone on the same network (an explicit opt-in, like the VLM exception).
dashboard:
  enabled: true
  host: 0.0.0.0
  port: 8899
  token: null # set a secret string to require X-Device-Token on all /api and /stream requests
  # (do this whenever host is not 127.0.0.1)
  # NOTE: the iOS app's live feed does NOT send this header yet -- setting a token here
  # makes /stream return 401 and the app shows an endless spinner. Leave null until the
  # app sends X-Device-Token.
  #
  # Live-feed cost controls. Annotating + JPEG-encoding competes with the detector for
  # CPU on the Pi, so frames are only encoded while someone is actually watching /stream.
  # Lower either value if detection framerate drops while the app's feed is open.
  jpeg_quality: 60 # 1-100; 80 was the old default, 50-60 is fine on a phone screen
  stream_fps: 12 # frames/sec pushed to a viewer; detection still runs at full camera fps

# AI accelerator (Raspberry Pi AI HAT+ / Hailo). Detected at startup and verified
# before inference; falls back to CPU automatically (visible in /api/health) unless
# `required` is set. `yolo_hef` must point to a model compiled for Hailo with the
# Dataflow Compiler (see docs/ACCELERATOR.md) — a .pt/.onnx cannot run on the HAT.
accelerator:
  enabled: true
  yolo_hef: null # e.g. /home/pi/sensordyme/models/yolov8s_h8l.hef (NMS-on-chip Model Zoo build)
  required: false # true = refuse to start without a usable accelerator

# Networking workflow (Pi only; ignored on a dev Mac):
# on boot NetworkManager auto-joins saved Wi-Fi; if nothing connects within
# `grace_s`, BLE provisioning opens ("SensorDyme-XXXX") so the app can send
# credentials — which are then SAVED for every future boot. BLE is for
# setup/config/commands only; the live feed always streams over Wi-Fi.
network:
  provisioning:
    method: ble # ble | hotspot (legacy scripts/provisioning_hotspot.sh) | off
    # 0 = open the Bluetooth setup window the moment the device is offline.
    # It closes again the instant Wi-Fi comes up, so a normal boot on a known
    # network advertises for a second or two and nobody sees it. A longer wait
    # only ever punishes the person standing there trying to set the device up.
    grace_s: 0 # seconds offline before the BLE setup window opens
    poll_s: 10 # how often to re-check connectivity

# Health monitoring and automatic recovery: every component (camera, inference,
# accelerator, dashboard, uplink, wifi, provisioning, hardware) is checked
# continuously; failures retry -> restart the component -> and only as a last
# resort (critical component down, restart budget spent) reboot the Pi.
# Reboots are rate-limited and require the sudoers rule setup_pi.sh installs.
health:
  check_interval_s: 2.0
  allow_reboot: true # only ever acts on the Pi; ignored on a dev Mac
  reboot_min_interval_s: 1800

# Future peripherals (ESP32-S3, BNO085 IMU, BN-880 GPS, MCP23017, MAX98357A,
# LEDs, buttons) — see hardware/hal.py. Absent hardware is never an error.
hardware: {}

# Cloud uplink: connects the device to the cloud backend in cloud/ (accounts, mobile app,
# push alerts, remote mode switching). Events and status only -- frames NEVER leave the
# device through this channel. The device works fully standalone when this is off/unreachable.
cloud:
  enabled: false
  # Use a NAME, not an IP. A fixed address is only true on the network it was
  # written down on: move either machine and the device keeps running perfectly
  # while appearing offline in the app. Both macOS and Pi OS resolve `.local`
  # out of the box. See docs/NETWORKING.md.
  #   good: http://your-macbook.local:8787
  #   bad:  http://192.168.1.251:8787
  base_url: http://localhost:8787 # your deployed cloud/ backend URL
  device_key: "" # issued by `python cloud/manage.py create-device <name>` -- see cloud/README.md
  # TLS is opt-in and OFF by default: base_url above is plain http:// and stays
  # that way unless you change it. Nothing below does anything until base_url
  # itself starts with https://.
  #
  # For a backend behind a real, CA-signed certificate (Let's Encrypt, Caddy,
  # a load balancer) -- the recommended setup for anything beyond a LAN, and
  # required for the iOS app to trust it without extra work -- leave both of
  # these alone; standard certificate verification against the system trust
  # store already applies automatically to any https:// base_url.
  #
  # ca_cert_path is for a self-signed cert on a private/dev backend (see
  # `python scripts/generate_dev_cert.py` and cloud/README.md's TLS section):
  # point this at that cert's .pem file and the device will trust exactly
  # that cert, and only that cert -- not "trust everything," which is what
  # tls_insecure_skip_verify below does and why it's the worse option.
  ca_cert_path: "" # path to a self-signed cert's PEM file, or leave empty
  # Skips certificate verification entirely. This is genuinely insecure (any
  # attacker on the network path can intercept and read/alter every event the
  # device sends) and exists only so a self-signed backend can be exercised
  # before ca_cert_path is set up, e.g. on a fresh dev machine. The device
  # logs a warning once, at startup, whenever this is true -- never enable it
  # outside of local development.
  tls_insecure_skip_verify: false
  # How often the device checks in: pushes queued events, and picks up a
  # pending mode-switch command. This is the dominant cost in "how long until
  # a mode switch shows as confirmed" -- measured (tests/test_cloud_backend.py,
  # a throwaway backend instance): the app<->cloud HTTP round trip itself is
  # under 5ms end to end, so the wait is polling cadence, not processing. At
  # 5s the worst case was ~2 poll cycles for the device round trip (pick up
  # the command, then report back) plus up to one more for the app's own
  # refresh to notice -- 10-14s worst case for something the product wants to
  # feel immediate. The device is mains-powered and each poll is a tiny JSON
  # POST, so there is no real battery or bandwidth cost to polling faster;
  # revisit only if this is ever deployed as a battery-powered device or at a
  # fleet size where per-device request volume becomes a real server cost.
  poll_interval_s: 2

logging:
  level: info # debug | info | warning | error — service log verbosity (journalctl -u sensordyme)
  csv_path: data/events.csv
  telemetry_csv_path: data/telemetry.csv # raw per-frame signals (throttled) -- future model-training data
  telemetry_interval_s: 0.5 # minimum seconds between two telemetry rows

alerts:
  sinks: [console, sound, gpio_buzzer] # gpio_buzzer drives the piezo on the Pi device; skipped with a notice on Mac
  # Evidence snapshots (PRIVACY: opt-in, and the ONLY exception to "frames are
  # never written to disk"): when true, one annotated JPEG is saved locally per
  # loud alert, bounded to evidence_max_files, never uploaded anywhere.
  save_evidence: false
  evidence_dir: data/evidence
  evidence_max_files: 50

  cooldown_s: 15 # minimum seconds between two alerts of the same type (patient: don't re-alert too soon)
  escalation_window_s: 60 # repeat within this window -> continuous tone (event types not in loud/soft_types below)
  loud_types: [drowsiness, phone_use, eyes_down, eyes_up, attention_lost, high_risk, # always the loud/continuous tone
               distraction, # sustained sideways head turn (3s+). Was in NEITHER list: locally it
               # escalated by repetition (a deliberate mechanism), but its severity tag fell back to
               # "soft", so it never pushed to the phone — while eyes_down (looking down 2.5s) was
               # loud and did. Looking away sideways is not less dangerous than looking down;
               # tagging it loud makes tone, severity and push behavior consistent for both.
               driverDistracted, driverUnresponsive, # openpilot terminal (red) alerts -- continuous alarm, as in the car
               phoneUseDetected, eyesClosedDetected, # openpilot module's additive distracted-driving flags
               skinnemoen_distracted, skinnemoen_phone_use, # skinnemoen module: every alert audible (additive)
               dashsentinel_drowsy, # DashSentinel's DROWSY status -- loud alarm
               fall, zone_violation, safe_zone_exit, # elderly/baby/security presets' own red alerts -- were
               # missing here entirely, so the device tagged them severity=soft. The app's BIG RED ALERT UI
               # (EventItem.severityStatus in Models.swift) and jupiter/explain.py both special-case these
               # three types as always-critical regardless of the stored severity string, but the cloud
               # notification gate (cloud/notify.py) trusts the stored string, not the type -- so a real fall
               # showed as a red alert on screen but never sent a push or SMS. Tagging it "loud" at the
               # source fixes every downstream consumer that trusts severity, instead of teaching each one
               # the type list separately.
               unusual_stillness, person_absent, flailing, choking_hazard, # baby/elderly presets' own alerts -- same bug as
               # the fall/zone fix above, found live: a real flailing event (device event id 3255) was
               # correctly registered as one of baby_monitoring's alert_types, which the severity formula
               # in services/runtime.py (`"loud" if in loud_types else "soft" if in soft_types OR in
               # alert_event_types else "log"`) defaults to "soft" for anything not EXPLICITLY loud --
               # meaning it reached Recent Activity and the local buzzer, but cloud/notify.py's
               # NotificationGate requires severity=="loud" (or a custom rule) and silently dropped every
               # push. unusual_stillness/person_absent have the identical gap. Baby Mode has no equivalent
               # of "the driver is in danger, interrupt them" signal in loud_types at all before this --
               # every one of its alert-worthy events, notification-wise, was unreachable by default.
               person_lingering, vehicle_in_zone, animal_in_zone, crowd] # security_monitoring's own alert_types --
               # the SAME class of bug, found by generalizing the fix above into a regression test
               # (tests/test_config.py) that checks every preset, not just baby_monitoring's. (Security's
               # fourth alert type, occupancy_change, was intentionally REMOVED from alert_types instead
               # of promoted here -- it fires on every person entering/leaving frame, and as a loud type
               # would interrupt constantly rather than never; matches baby_monitoring's own
               # person_count_change, log-only by the same reasoning.)
  soft_types: [fatigue_warning, frequent_glancing, elevated_risk, erratic_hand_movement, # always the soft chime
               promptDriverDistracted, promptDriverUnresponsive, # openpilot prompt (orange) alerts -- chime, as in the car
               distractionDetected, # openpilot module's additive instant chime (fires ~0.3s after detection)
               skinnemoen_calibration_complete, # skinnemoen calibration-done chime (the original beeped here)
               dashsentinel_warning, dashsentinel_no_face, dashsentinel_vision_degraded] # DashSentinel soft tiers
  gpio_buzzer_pin: 17 # BCM pin, Pi only

# --- Training capture (OPT-IN, LOCAL ONLY) -----------------------------------
# Off by default, and deliberately so: a camera that accumulates footage of your
# home without being asked is the thing customers are right to fear. When on,
# frames are written to `dir` on this device and NEVER uploaded — there is no
# network path out. Getting data off the device is a separate command a person
# runs: `python scripts/export_dataset.py --source data/training --out <path>`.
#
# capture_negatives records ordinary frames with nothing happening. A detector
# trained only on frames containing the target learns to say yes, so negatives
# matter — but they are footage of normal life, which is why they are a second,
# separate opt-in.
training:
  capture:
    enabled: false
    dir: data/training
    max_samples: 500 # capture stops here; it never fills the card
    min_interval_s: 5.0 # rate limit, so one sustained event can't flood the set
    capture_negatives: false
    negative_interval_s: 300.0

modules:
  driver_attention:
    # --- eye gaze (independent of head pose; see core/eye_signal.py) ---
    enable_gaze: true # fuse eye-in-head offset (iris landmarks, already computed --
    # refine_landmarks is on below) onto head yaw/pitch, so "head forward, eyes down"
    # is detectable and not just head pose renamed. false = old head-pose-only behavior.
    eye_gaze_scale_deg: 40.0 # extreme iris deflection to the socket edge ~= this many
    # degrees of eye-in-head rotation (approximation, matches the value already
    # validated on the mac_max profile's own gaze fusion)

    # --- signal conditioning (glasses/glare robustness; see core/eye_signal.py) ---
    # Raw EAR and head-pose readings are noisy measurements, and glasses make
    # them noisier: frames and glare corrupt the eyelid-contour landmarks for
    # single frames at a time. These stages sit between the landmarks and every
    # threshold below, so one bad frame can neither trigger nor reset anything.
    signal_median_window: 5 # rolling median over this many frames for EAR/yaw/pitch; 1 disables
    signal_release_s: 0.4 # a condition must be FALSE this long before its timer resets or its
    # live alert clears -- bridges one-frame landmark dropouts without changing
    # how fast anything fires (detection latency is unchanged; see
    # tests/test_driver_signal_conditioning.py)
    ear_baseline_window_s: 60.0 # session open-eye reference window: the effective closure
    # threshold follows the upper percentile of the last minute's EAR, so putting
    # glasses on (which shifts the whole EAR distribution) doesn't leave the
    # threshold calibrated for a bare face
    ear_baseline_band_low: 0.6 # the session reference may not drift below/above this
    ear_baseline_band_high: 1.4 # fraction of the calibrated baseline -- glasses shift a
    # baseline by tens of percent; genuinely closing eyes would need far more,
    # so pathology cannot drag the threshold down with it
    iris_veto: true # when the eyelid EAR claims "closed" but the iris landmarks (already
    # computed; FaceMesh runs with refine_landmarks=true) show a plainly visible
    # iris, trust the iris: a visible iris and a closed eye cannot both be true.
    # Only ever suppresses a false closure, never invents one.

    # --- drowsiness (eye closure) ---
    ear_threshold_ratio: 0.75 # personal threshold = this * the calibrated open-eye baseline EAR
    ear_threshold_fallback: 0.20 # used only before calibration completes, or if calibration.json is unreadable
    calibration_duration_s: 10.0 # seconds of startup sampling (look at the road) used to compute EAR + head-pose baselines
    calibration_max_pose_spread_deg: 20 # if yaw/pitch samples during the window haven't settled within this many
    # degrees of their own mean (still glancing around -- phone, mirror, getting seated), the window is extended
    # rather than averaging a glance-at-the-phone into "neutral". Never SHORTENS calibration, only extends it.
    calibration_max_duration_s: 30 # hard ceiling on the extension above -- calibrates anyway past this point
    # (imperfectly calibrated is better than stuck uncalibrated forever)
    calibration_path: data/calibration.json # persisted baseline; delete or pass --recalibrate to redo it
    drowsy_seconds: 2.0 # continuous eye closure (EAR < threshold) required to fire "drowsiness" -- blinks are far shorter
    perclos_window_s: 60.0 # rolling window (seconds) for PERCLOS = % of time eyes were closed
    perclos_threshold: 0.15 # PERCLOS above this fires "fatigue_warning" even with no single long closure

    # --- distraction (head pose, corrected for camera mounting angle -- see calibration above) ---
    yaw_threshold_deg: 35 # |calibrated yaw| beyond this = looking away from the road (sideways)
    distraction_seconds: 3.0 # sustained duration required to fire "distraction" for an ordinary
    # off-center glance (at a passenger, the console, ...)
    mirror_check_yaw_deg: 55 # |calibrated yaw| beyond THIS = a wide-angle turn shaped like a
    # rearview/side-mirror or blind-spot check, not an ordinary glance -- gets more patience
    # (rearview_tolerance_seconds) rather than distraction_seconds. This applies to any episode
    # whose yaw REACHES mirror_check_yaw_deg at any point -- the return sweep back through a
    # smaller angle is part of the same maneuver, not evidence it was never one.
    #
    # CORRECTED 2026-08-29. The old comment claimed the opposite ("reverts to distraction_seconds
    # immediately if the yaw ever drops back to merely off-center"), and that behaviour is what
    # made this setting DEAD: CorroboratedGraceTracker latched corroboration from an episode's
    # FIRST frame, and an episode necessarily opens at yaw_threshold_deg (35), which is below
    # mirror_check_yaw_deg (55) -- a head passes through 35 on its way to 70. So the first frame
    # always latched "not a mirror check" and rearview_tolerance_seconds could never apply to any
    # real head turn in any configuration. Measured before the fix: a 0->70 degree sweep held at
    # 70 fired distraction at 3.45s (the SHORT threshold) with corroborated=False on every frame.
    # modules/driver_attention.py now uses PeakCorroboratedGraceTracker for distraction, which
    # accumulates corroboration within an episode (and resets between them, so a wide turn never
    # lends its patience to the ordinary glance that follows it). face_lost deliberately KEEPS the original
    # revert-on-dropout semantics -- a body that stops being detected is a situation getting
    # worse, which is not the same shape of evidence as a yaw returning through 40 degrees.
    rearview_tolerance_seconds: 5.0 # sustained duration allowed for a wide-angle (mirror_check_yaw_deg+)
    # turn before it counts as "distraction" -- a real mirror/blind-spot check, even a thorough one
    # covering rearview + both mirrors + a shoulder check, is expected to be under this
    glance_window_s: 45.0 # rolling window (seconds) for the repeated short-glance counter
    glance_min_count: 5 # this many off-center glances within glance_window_s fires "frequent_glancing"
    pitch_threshold_deg: -20 # calibrated pitch below this = looking down (phone in lap); more sensitive than yaw
    eyes_down_seconds: 2.5 # sustained duration required to fire "eyes_down"
    pitch_up_threshold_deg: 20 # calibrated pitch above this = looking all the way up (visor, overhead console,
    # ceiling) -- the focused-driving zone is bounded above the neutral pose too, not just below it
    eyes_up_seconds: 2.5 # sustained duration required to fire "eyes_up"
    face_lost_seconds: 2.5 # face gone AND no person detected either -> "attention_lost" (likely gone/slumped/obstructed)
    face_lost_with_body_seconds: 8.0 # face gone but the object detector still finds a person in frame (a
    # turned head checking a mirror/blind spot, not a vanished driver) -> the same "attention_lost" event,
    # but more patient. Reverts to face_lost_seconds immediately if the person also stops being detected
    # partway through -- see CorroboratedGraceTracker; never slower to fire than face_lost_seconds alone.

    # --- object detection: scans the ENTIRE frame (not just near the face) for anything
    # the driver could be holding, via YOLO11-nano run every Nth frame ---
    yolo_weights: yolo11n.pt # shared with occupancy.py via core/detectors.py (loaded once, cached)
    yolo_every_n_frames: 3 # run YOLO (+ hands) on 1 out of every N frames; Face Mesh still runs every frame
    yolo_confidence_threshold: 0.10 # minimum YOLO detection confidence to count.
    # LOWERED from 0.35 (2026-08-29), from measurement rather than intuition. Scored on
    # the State Farm val split (subject-disjoint, 400 phone-present / 200 phone-absent
    # frames) with `python benchmarks/accuracy_state_farm.py`:
    #     conf   phone recall   precision
    #     0.35        10.8%       100.0%   <- the old value: missed ~9 phones in 10
    #     0.10        51.7%        95.8%   <- here
    #     0.05        67.8%        93.5%   (best F1, but see below)
    # Re-run that command after ANY change here; it writes a JSON baseline and has a
    # --compare mode that fails on regression.
    #
    # Why 0.10 and not the best-F1 0.05: per-frame false positives are NOT all absorbed
    # downstream. `phone_use` is protected (it needs phone_visible AND eyes_off_road
    # sustained for phone_use_seconds), but `phone_detected` fires on the RISING EDGE of
    # visibility with no sustain gate, and phone_risk feeds RiskFusion on mere
    # visibility. Both scale directly with per-frame FPs, so the extra 16 points of
    # recall at 0.05 is not free.
    #
    # NOTE this threshold gates EVERY class in the same YOLO pass, not just phones --
    # including the COCO person class used to corroborate face-loss (more detections =
    # more patience before attention_lost, the safer direction) and the food/drink
    # classes (whose false positives are now spatially gated to the driver's upper
    # region in modules/driver_attention.py, so a bottle in a footwell fires nothing).
    yolo_classes: # COCO class name -> event type this module emits when that class appears
      cell phone: phone_detected
      cup: eating_drinking
      bottle: eating_drinking
      wine glass: eating_drinking
      bowl: eating_drinking
      banana: eating_drinking
      apple: eating_drinking
      orange: eating_drinking
      broccoli: eating_drinking
      carrot: eating_drinking
      hot dog: eating_drinking
      pizza: eating_drinking
      donut: eating_drinking
      cake: eating_drinking
      sandwich: eating_drinking
      fork: eating_drinking
      knife: eating_drinking
      spoon: eating_drinking
    phone_use_seconds: 2.0 # phone visible AND (eyes_down OR yaw off-center), sustained this long -> "phone_use"
    enable_hands: true # MediaPipe Hands: a hand overlapping the phone box raises phone_use confidence
    hand_phone_iou_threshold: 0.2 # hand/phone box IoU above this counts as "holding it"

    # --- erratic hand movement (hands leaving the wheel / frantic motion) ---
    # Reuses the SAME hand boxes already computed above (no added inference), tracked
    # via core.tracking.BoxTracker so "erratic" is judged from trajectory (peak speed
    # AND a direction-reversal count -- core/activity.py's Baby Mode flailing detector
    # uses the same two-signal pattern), not a two-frame position delta. Coarser than
    # Baby Mode's every-frame Pose kinematics: hands are only sampled on the object-
    # detector's own stride (yolo_every_n_frames above).
    erratic_hand_min_speed: 2.0 # box-diagonals/s, peak hand speed
    erratic_hand_min_reversals: 3 # direction reversals within the tracked trail
    erratic_hands_seconds: 1.0 # continuous erratic state required before it confirms

    # --- risk fusion: reasons across signals together (see modules/driver_attention.py::RiskFusion) ---
    risk_ema_alpha: 0.3 # smoothing for the composite score; higher = reacts faster but noisier
    risk_elevated_threshold: 0.4 # composite score above this fires the soft "elevated_risk" event
    risk_high_threshold: 0.75 # composite score above this, sustained, fires the loud "high_risk" event
    risk_confirm_seconds: 1.0 # composite score must stay above risk_high_threshold this long to fire "high_risk"

  driver_attention_openpilot:
    # comma.ai openpilot's driver monitoring, verbatim (model + policy from openpilot
    # v0.9.7). Run with: make dev-openpilot. See modules/driver_attention_openpilot.py.
    model_path: dmonitoring_model.onnx # auto-downloaded from the openpilot repo on first run (~16MB)
    sim_speed_ms: 25.0 # simulated vEgo (m/s); >13 so openpilot's pose auto-calibration runs, as on the highway
    sim_engaged: true # start with openpilot "engaged" (active monitoring, 11s countdown); toggle live with [e]
    always_on: false # openpilot's Always-On Driver Monitoring toggle
    sim_brake_disengage_prob: 0.0 # modelV2 brake-disengage prob: 0 = steady cruising (their lenient thresholds)
    instant_distraction_sound: true # ADDITIVE (not stock openpilot): chime the moment openpilot's own
    # "certainly distracted" signal fires (~0.3s after detection), instead of staying silent until the
    # ~5s orange prompt. Set false for the untouched in-car experience. Re-beep spacing = alerts.cooldown_s.
    # --- ADDITIVE distracted-driving flags (openpilot's published model can't see phones) ---
    phone_detection: true # YOLO phone detector; "using it" = phone box + hand overlap, sustained
    phone_weights: yolo11n.pt # nano is plenty at webcam resolution; swap to yolo11x.pt for max accuracy
    phone_device: mps # runs on the M3 GPU alongside the openpilot model on CPU
    phone_every_n_frames: 3 # detection stride; the openpilot model still runs every frame
    phone_confidence_threshold: 0.35
    hand_phone_iou_threshold: 0.2 # hand/phone box IoU above this counts as "holding it"
    enable_hands: true # MediaPipe Hands; false = phone visible alone counts as use
    phone_use_seconds: 1.0 # sustained phone-in-hand duration -> "phoneUseDetected" (loud)
    eyes_closed_seconds: 2.0 # sustained eye closure -> "eyesClosedDetected" (loud)
    eyes_closed_blink_threshold: 0.865 # openpilot's own _BLINK_THRESHOLD, applied to its blink signal

  driver_attention_skinnemoen:
    # erlendskinnemoen's MediaPipe FaceMesh DMS (github course project), vendored verbatim
    # for head-to-head accuracy comparison. Run with: make dev-skinnemoen. The original
    # algorithm has no tunable parameters -- its thresholds are hardcoded and kept as-is
    # (EAR threshold at 80% toward closed, 30deg angle limit, PERCLOS>0.8 over ~10s).
    # --- ADDITIVE phone detection (the original has none): phone in frame + driver
    # looking at it (its own DISTRACTED angle condition) -> skinnemoen_phone_use (loud) ---
    phone_detection: true
    phone_weights: yolo11n.pt
    phone_device: mps
    phone_every_n_frames: 3
    phone_confidence_threshold: 0.35

  driver_attention_dashsentinel:
    # DashSentinel (github.com/alec-kr/DashSentinel), vendored under third_party/ --
    # its real feature-extraction + adaptive-scoring pipeline with its own CLI defaults.
    # Run with: make dev-dashsentinel. ~25s calibration; the per-driver profile PERSISTS
    # and adapts across sessions (delete the file below to start fresh).
    profile_path: data/dashsentinel_profile.json
    rebuild_baseline_on_start: false # true = wipe the learned profile at launch
    warning_threshold: 0.42 # their smoothed drowsy-score tiers
    drowsy_threshold: 0.58
    calibration_seconds: 25
    ear_threshold: 0.23
    yawn_mar_threshold: 0.45
    yawn_frames_threshold: 12
    refine_landmarks: false # their default; true adds iris landmarks (slower)

  occupancy:
    confidence_threshold: 0.5 # YOLO person-detection confidence threshold
    confirm_frames: 3 # frames a new count must persist before it's emitted
    model_weights: yolo11n.pt # auto-downloaded by ultralytics on first run
    # Optional security zones (normalized 0..1 coords; see core/zones.py).
    # A person's feet inside a `restricted` zone -> zone_violation (sustained);
    # staying past linger_s -> person_lingering. Example:
    #   zones:
    #     front_door: { polygon: [[0.6,0.2],[0.95,0.2],[0.95,0.9],[0.6,0.9]], kind: restricted }
    zones: {}
    zone_confirm_s: 2.0 # seconds inside a zone before zone_violation/vehicle_in_zone/animal_in_zone confirms
    linger_s: 30.0 # seconds inside a zone before person_lingering confirms
    # vehicle_in_zone / animal_in_zone need no separate config: whenever any zone above is
    # configured, the detector automatically also requests car/truck/bus/motorcycle/bicycle/
    # train and dog/cat/bird/... (core.capabilities' "vehicle"/"animal" category words --
    # the same vocabulary Jupiter uses) and watches for them the same way it watches for people.
    verify_new_tracks_with_pose: false # opt-in cross-model corroboration: a real second model
    # (MediaPipe Pose, cropped to just the new box) checked once per new tracked person, noted
    # on person_lingering's event detail when it finds no pose -- never used to suppress an
    # alert (see modules/occupancy.py's docstring for why). Off by default: it's a real added
    # model this module is otherwise deliberately built without, so nothing about its resource
    # footprint changes unless a deployment explicitly wants the extra corroboration.
    crowd_threshold: 4 # confirmed people on screen at once -> "crowd" (sustained, no zone needed)
    crowd_confirm_s: 5.0 # seconds at/above crowd_threshold before it confirms

  baby_monitoring:
    confidence_threshold: 0.4 # YOLO person-detection confidence (children are smaller/lower-conf)
    detect_every_n_frames: 2 # run detection every Nth frame (motion runs every frame)
    model_weights: yolo11n.pt
    still_warning_s: 120 # unusually-still warning after this many seconds of low motion
    still_max_motion: 0.015 # motion-energy floor below which the subject counts as "still"
    absence_warning_s: 30 # person_absent confirms after this long (only if expect_presence)
    expect_presence: true # true = alert when nobody is visible (e.g. nap monitoring)
    # CHANGED from false (2026-08-29). person_absent is only REGISTERED as a rule when
    # this is true, so with it off the default and play_area presets said NOTHING when
    # the baby stopped being detected at all -- measured: 10 minutes of no detection
    # produced zero alertable events. A baby covered by a blanket, face-down in bedding,
    # or rolled where the detector loses the small low-contrast box is exactly the case
    # that must not be silent. Only the nap_time preset variant enabled it before.
    # Setting this explicitly to false still opts out (there is a test for that).
    zone_confirm_s: 2.0
    # Safe zone = where the child should stay (crib/play area): leaving it alerts.
    # Restricted zones = user-drawn danger areas (stairs/pool/stove): entering alerts.
    #   zones:
    #     crib:   { polygon: [[0.2,0.2],[0.8,0.2],[0.8,0.9],[0.2,0.9]], kind: safe }
    #     stairs: { polygon: [[0.0,0.5],[0.15,0.5],[0.15,1.0],[0.0,1.0]], kind: restricted }
    zones: {}
    holding_bottle_confirm_s: 1.0 # sustained overlap with a detected bottle before "holding_bottle" fires
    holding_object_confirm_s: 1.0 # same, for object_classes below -> "holding_object"
    holding_cooldown_s: 3.0 # re-confirmation suppression after a holding_* event resolves --
    # deliberately much shorter than the 30s the event engine defaults to elsewhere (zone/
    # presence rules, where a long cooldown avoids re-alerting on flapping): a child puts an
    # object down and picks up a DIFFERENT one constantly, and each is a legitimate new
    # observation, not repeat noise. holding_object is ALSO keyed per-label internally (see
    # modules/baby_monitoring.py), so this cooldown can never let one object class's timer
    # suppress a different class picked up moments later.
    # --- human-object interaction: a tracked item's TRAJECTORY closing on the child,
    # before it ever overlaps -- an anticipatory, log-only signal a single-frame
    # overlap test can't see (see core.tracking.BoxTracker / modules/baby_monitoring.py).
    object_approaching_min_speed: 0.15 # box-diagonals/s -- floor so a barely-jittering
    # stationary item never qualifies
    object_approaching_confirm_s: 0.3 # continuous approach required before it confirms
    object_approaching_cooldown_s: 2.0 # re-confirmation suppression after it resolves
    # COCO class name -> label used in "holding_object"'s event detail (e.g. "object=phone").
    # Same box-overlap-with-the-child approximation as holding_bottle (see modules/baby_monitoring.py),
    # runs on the SAME detector pass already scanning for person/bottle -- no added inference cost.
    # Logged (dashboard/Recent Activity), not an alert by default -- see presets.yaml's alert_types.
    # "keys" is deliberately absent: COCO (what the object detector actually knows) has no such
    # class; this module refuses to claim a detection the model can't perform.
    object_classes:
      cell phone: phone
      cup: cup
      wine glass: cup
      bowl: bowl
      banana: food
      apple: food
      orange: food
      sandwich: food
      hot dog: food
      pizza: food
      donut: food
      cake: food
      fork: utensil
      knife: utensil
      spoon: utensil
      scissors: hazard
      remote: object

    # --- arm/body motion: MediaPipe Pose, for frantic/flailing-movement detection.
    # See core/activity.py's FLAIL_* constants for the full rationale -- this uses
    # temporal trajectory analysis (peak wrist speed/acceleration + direction-
    # reversal frequency over a rolling ~1.2s window), not a two-frame position
    # delta. Reuses the exact landmark model modules/fall_detection.py already runs
    # every frame elsewhere in this product (proven affordable on a Pi).
    enable_pose: true # false = fully opt out of pose inference (no flailing detection,
    # lower CPU) for a deployment that can't spare the extra model
    pose_every_n_frames: 1 # 1 = every frame (matches fall_detection.py); raise to
    # trade flailing-detection latency/precision for CPU on a heavily loaded Pi
    hand_association_threshold: 0.35 # core.hand_perception's per-frame "is this object
    # really in this hand" bar (engine default 0.55). Lowered here, empirically: hardware
    # testing found a hand near the FACE (the choking-hazard case this exists for) produces
    # a smaller ROI than a hand at chest/lap height -- torso-length-based sizing shrinks in
    # that posture -- and a genuine held object peaked at 0.38 association, never crossing
    # the shared default. Scoped to this module's config only; the shared engine default is
    # unchanged for any other future caller (see core/hand_perception.py's module docstring).
    flailing_confirm_s: 0.5 # continuous flailing state (already smoothed by the
    # rolling window itself) required before "flailing" confirms
    flailing_resolve_after_s: 3.0 # absence of flailing needed to resolve an active
    # episode -- widened from 1.5s so a brief lull inside one real episode doesn't
    # resolve+reconfirm (and re-notify) for what is a single ongoing event
    flailing_cooldown_s: 8.0 # re-confirmation suppression after flailing resolves --
    # short on purpose: repeated episodes (calm, flail again) should each be reported
    # flail_min_peak_speed: 1.6 # torso-lengths/s, peak wrist speed -- uncomment to override
    # flail_min_peak_accel: 6.0 # torso-lengths/s^2, peak wrist acceleration
    # flail_min_reversals: 4 # direction reversals within the window
    # flail_min_reversal_amplitude: 0.10 # torso-lengths of travel per reversal leg

    # --- choking hazard: a hand-held object on a closing trajectory toward the
    # baby's mouth region. Requires enable_pose above (needs hand tracking, the
    # SAME core.hand_perception engine holding_object/object_picked_up already
    # use) -- see modules/baby_monitoring.py's _assess_choking_hazard for the
    # full risk model (held + small-relative-to-hand + closing distance +
    # trajectory, multiplied together, never a single-frame trigger).
    choking_hazard_risk_threshold: 0.30 # minimum combined risk score (0-1) before this
    # even starts counting toward confirmation -- see the risk formula above.
    #
    # LOWERED from 0.4 (2026-08-29). The previous value was ABOVE the physical ceiling
    # of the signal, so this critical alert could not fire in any deployment. The
    # arithmetic: risk = association * size * proximity * trajectory, and every factor
    # after the first is <= 1.0, so risk can never exceed the association score -- and
    # hand_association_threshold's own comment below records that hardware testing
    # measured a genuine held object near the face at ~0.38 association. Measured by
    # execution: the best case (small object, held, at the mouth, actively closing)
    # scores 0.380; a genuine hazard still ~0.1 baby-diagonals out scores 0.348; the
    # strongest FALSE-evidence case (high association, motionless at the mouth, no
    # observed trajectory) scores 0.212. 0.30 sits between them.
    #
    # The old comment here reasoned carefully about not raising this value while a
    # SECOND, invisible gate already sat above it: the rule's RuleSpec did not set
    # min_confidence, so it inherited EventEngine's default of 0.50, and the risk
    # score is passed AS that confidence. The effective gate was 0.50 against a 0.38
    # ceiling. modules/baby_monitoring.py now sets min_confidence explicitly -- if you
    # retune this value, check that one too or you will be tuning the wrong number.
    choking_hazard_confirm_s: 0.8 # continuous risk >= threshold required before it
    # confirms -- widened from 0.4s/3 frames (still short enough to interrupt promptly)
    # so a one-off jittery frame can't confirm; see modules/baby_monitoring.py's
    # trajectory_factor tightening for the other half of this precision pass
    choking_hazard_cooldown_s: 6.0 # re-confirmation suppression after it resolves

  fall_detection:
    drop_velocity_threshold: 0.6 # fraction of frame-height/sec that counts as a "rapid drop"
    stillness_duration_s: 1.5 # seconds of stillness after a drop before a fall event fires --
    # ALSO the fall EventEngine rule's persist_s (see modules/fall_detection.py), so a preset
    # variant that overrides this (presets.yaml's post_surgery/active_senior) tunes both together
    stillness_velocity_threshold: 0.02 # fraction of frame-height/sec considered "still"
    # --- fall state-machine tuning: see modules/fall_detection.py's module docstring for
    # the two failure modes (missed falls, spurious later false positives) these exist to fix.
    fall_pose_recovery_max_gap_s: 2.5 # a total pose-tracking dropout (motion blur/extreme pose
    # during the violent part of a real fall) reacquired as lying-down within this long still
    # counts as a fall, even though the drop itself was never directly measured
    fall_upright_recency_s: 0.5 # the person must have read as confidently upright THIS
    # recently before tracking was lost for the recovery path above to apply -- excludes
    # "was already down, camera glitched" from ever looking like a fall
    fall_pending_timeout_s: 6.0 # abandon a pending fall that never resolves either way
    # (never confirms, never clearly returns to standing) so a stale pending flag can't
    # confirm against unrelated stillness much later
    fall_resolve_after_s: 4.0 # must be seen NOT lying down for this long before a confirmed
    # fall clears -- generous on purpose: a brief sit-up-then-back-down after a real fall
    # must not clear the alert
    fall_cooldown_s: 0.0 # re-confirmation suppression after a fall resolves.
    # SET TO ZERO from 20.0 (2026-08-29). EventEngine's cooldown gate returns BEFORE a
    # track is created, so a second fall inside the window never entered the lifecycle
    # at all -- no event, no alert, no log row. Measured: fall #1 alerts, an identical
    # real fall ~6s later produces []. Repeat falls in quick succession (syncope, a
    # failed attempt to stand) are the clinically most alarming pattern and were being
    # reported as one. A fall is not detector jitter, so it gets no cooldown:
    # resolve_after_s below is sufficient anti-spam, because re-confirming requires
    # being observed lying down AND still for stillness_duration_s, which jitter cannot
    # fake. Cooldowns remain appropriate for chattier detections (zone_violation etc).
    # Optional elderly-mode zones -- same shape as occupancy's/baby's, tested
    # against the ankle midpoint instead of a box (see core/zones.py).
    #   restricted/boundary: feet inside -> zone_violation (sustained)
    #   safe (e.g. a "bed" zone): feet outside ALL safe zones -> safe_zone_exit
    #     -- bed monitoring: "getting out of bed", the same safe_zone_exit
    #     baby_monitoring.py uses for a crib
    #   zones:
    #     stairs: { polygon: [[0.0,0.6],[0.3,0.6],[0.3,1.0],[0.0,1.0]], kind: restricted }
    #     bed: { polygon: [[0.1,0.3],[0.7,0.3],[0.7,0.9],[0.1,0.9]], kind: safe }
    zones: {}
    zone_confirm_s: 2.0 # seconds inside a watched zone before zone_violation confirms
    still_max_motion: 0.01 # normalized hip/shoulder-centroid movement floor below which
    # the subject counts as "still" (independent of the fast-drop velocity above)
    unusual_stillness_s: 600 # unusual_stillness confirms after this many seconds of it --
    # deliberately long: a person resting or reading is not a safety event, only an
    # absence of ANY movement for this long is worth a soft, warning-level nudge

# ============================================================================
# mac_max profile -- additive, Mac-only, GPU-backed high-accuracy mode.
# Read ONLY when `profile: mac_max` above. Never read by, and never affects,
# the pi profile or anything under `modules:`. See modules/driver_attention_max.py.
# Every threshold below cites its real-world basis.
# ============================================================================
mac_max:
  device: mps # torch device for detection; startup refuses to run if MPS is unavailable

  driver_attention:
    # --- calibration: one combined "look at the screen center" prompt, captures
    # both the personal EAR baseline and the neutral forward-gaze baseline ---
    calibration_seconds: 3.0 # spec: prompt-based calibration, short enough to not annoy the user
    calibration_path: data/gaze_calibration.json # separate file from the pi profile's data/calibration.json
    ear_threshold_ratio: 0.75 # same calibrated-ratio approach as the pi profile (modules/driver_attention.py)
    ear_threshold_fallback: 0.20

    # --- blink vs. drowsiness (human-factors literature) ---
    blink_ignore_max_s: 0.5 # normal voluntary/reflex blinks last ~100-400ms (Schiffman, "Sensation and Perception");
    # closures shorter than this are completely ignored, not just debounced
    microsleep_seconds: 0.5 # 0.5-1.5s sustained closure = microsleep territory -> "microsleep_warning" (soft)
    drowsiness_seconds: 1.5 # >1.5s sustained closure -> "drowsiness" (loud)
    perclos_window_s: 60.0 # PERCLOS: standard rolling window used in drowsiness research (Wierwille et al., FHWA)
    perclos_fatigue_threshold: 0.15 # PERCLOS > 0.15 -> "fatigue" state/event (commonly cited moderate-drowsiness cutoff)
    perclos_escalate_threshold: 0.25 # PERCLOS > 0.25 -> "fatigue_critical" (loud) -- severe-drowsiness cutoff
    blink_rate_window_s: 120.0 # rolling 2-minute window for blinks/min
    blink_rate_baseline_seconds: 300.0 # first 5 minutes of the session establish the user's own baseline rate
    blink_rate_low_per_min: 8.0 # normal awake blink rate is roughly 15-20/min; sustained rate below this is atypical
    blink_rate_high_per_min: 30.0 # sustained rate above this (rapid blinking) is also an atypical fatigue signal
    fatigue_pattern_confirm_s: 30.0 # blink rate must stay out of [low, high] this long before "fatigue_pattern" fires
    # (log-only -- feeds the FATIGUED state, does not alert on its own)

    # --- glance / eyes-off-road (NHTSA-based, using the fused gaze vector, not just head yaw) ---
    gaze_off_road_seconds: 2.0 # NHTSA visual-manual distraction guideline: single glance > 2s -> "eyes_off_road"
    excessive_glance_window_s: 12.0 # rolling window for cumulative (not single-glance) off-road time
    excessive_glance_budget_s: 4.5 # cumulative off-road gaze > 4.5s within 12s -> "excessive_glancing"
    # (the texting pattern: many short glances, none individually over the 2s single-glance limit)
    gaze_yaw_threshold_deg: 20 # gaze-vector (head + eye-in-head) yaw beyond this = off-road; tighter than raw
    # head yaw alone since eye deviation is added on top
    gaze_pitch_down_threshold_deg: -15 # gaze pitch below this = looking down (phone in lap)
    eyes_down_seconds: 1.5 # tighter than the sideways gaze limit -- looking down is more dangerous, less legitimate

    # --- detection: full-frame, full frame rate (Mac can afford it) ---
    detector_weights: yolo11x.pt # highest-accuracy model in the YOLO11 family; swap to rtdetr-l.pt for A/B testing
    # (same ultralytics YOLO(...) loader dispatches on either checkpoint's own architecture)
    detector_confidence_threshold: 0.4 # a larger, more accurate model affords a stricter threshold than the nano one
    detector_classes: # COCO class name -> event type (deliberately narrower than the pi profile's list --
      cell phone: phone_detected # this profile is about proving out the fusion logic precisely, not class coverage)
      cup: eating_drinking
      bottle: eating_drinking
      sandwich: eating_drinking
      banana: eating_drinking
      donut: eating_drinking
      person: person_detected # log-only bookkeeping; not used by any alert logic
    enable_hands: true # MediaPipe Hands runs every frame in this profile (no stride -- Mac can afford it)

    # --- phone / object fusion: confidence stacking, not single triggers ---
    hand_phone_iou_threshold: 0.2 # hand/phone box IoU above this counts as "holding it" (matches the pi profile)
    phone_alone_confidence: 0.3 # phone visible, eyes forward, no hand overlap -> log-only (mounted GPS is legitimate)
    phone_in_hand_confidence: 0.7 # phone + hand overlap -> "phone_in_hand" (soft)
    phone_use_distracted_confidence: 0.95 # phone + hand overlap + (eyes_down OR off-road), sustained -> loudest tier
    phone_use_distracted_seconds: 1.5 # sustain duration required for the loudest phone_use_while_distracted tier
    hand_face_proximity_window_s: 30.0 # rolling window for repeated hand-to-face motion (eating pattern)
    hand_face_proximity_min_count: 2 # >= this many hand-approaches-face episodes in the window -> eating_drinking
    hand_face_distance_ratio: 0.6 # heuristic (no specific literature value): hand-to-face-box distance, as a
    # fraction of the face box's own size, counted as "near"

    # --- temporal smoothing ---
    median_filter_frames: 5 # ~5-frame rolling median on every raw signal before it reaches the state machine,
    # so a single flickered detection never causes a state change

    # --- frontier VLM judge: a Claude vision model as the slow, precise tier ---
    # The local pipeline keeps the fast reflexes; every interval_s an in-memory JPEG of the
    # current frame is sent to the Anthropic API and classified with human-level scene
    # understanding (mounted GPS vs held phone, asleep vs looking down, wallet vs phone).
    # A dangerous verdict must repeat on confirm_judgments consecutive calls at or above
    # min_confidence before a vlm_confirmed_* alert fires -- one flaky classification never
    # alerts. PRIVACY: enabling this transmits frames (in memory, never via disk) to the
    # Anthropic API; the pi profile is entirely unaffected. Requires credentials
    # (ANTHROPIC_API_KEY or `ant auth login`); without them it prints one line and disables
    # itself -- local detection continues unaffected.
    vlm:
      enabled: true
      # provider selects the judge backend -- swap one line to A/B different VLMs on the
      # same harness. Accuracy ceiling: anthropic > NVIDIA NIM (cloud) > local Qwen 7B.
      #   anthropic          -- Claude via the Anthropic API (default; most accurate; frames transmitted)
      #   ollama             -- local model via Ollama, e.g. Qwen2.5-VL; frames NEVER leave this Mac; free
      #   openai_compatible  -- any OpenAI-compatible endpoint: NVIDIA NIM, LM Studio, vLLM, ...
      provider: openai_compatible # Google Gemini via its OpenAI-compatible endpoint (free-tier key)
      model: gemini-3.1-flash-lite # verified working end-to-end with this key (3-frame burst, ~1s/verdict).
      # gemini-3.5-flash is stronger but was returning free-tier 503s at setup time -- worth retrying later;
      # gemini-2.5-flash is retired for new users.
      base_url: https://generativelanguage.googleapis.com/v1beta/openai
      api_key_env: GEMINI_API_KEY # export it (set in ~/.zshrc); the key itself is NEVER stored in this file
      max_tokens: 1024 # Gemini 3.5 Flash spends hidden thinking tokens against this budget before the
      # visible JSON verdict -- 300 (the default) can come back empty; 1024 leaves comfortable room
      #
      # --- Claude via the Anthropic API (the accuracy ceiling; needs ANTHROPIC_API_KEY) ---
      # provider: anthropic
      # model: claude-opus-4-8
      # base_url: null
      # api_key_env: null
      # interval_s: 4.0
      #
      # --- Qwen2.5-VL locally (fully on-device, free) ---
      # provider: ollama
      # model: qwen2.5vl:7b        # first: install Ollama from ollama.com, then `ollama pull qwen2.5vl:7b`
      # interval_s: 12.0           # a 7B VLM takes several seconds per frame on an M3 -- pace accordingly
      #
      # --- NVIDIA NIM (cloud; pick a vision model + copy its exact ID from build.nvidia.com) ---
      # provider: openai_compatible
      # model: <model id from build.nvidia.com, e.g. an NVIDIA vision/VL model>
      # base_url: https://integrate.api.nvidia.com/v1
      # api_key_env: NVIDIA_API_KEY
      #
      # --- Google Gemini (cloud; via Google's OpenAI-compatible endpoint -- key from aistudio.google.com) ---
      # provider: openai_compatible
      # model: gemini-2.5-flash      # fast/cheap and strong at vision; check ai.google.dev for the latest IDs
      # base_url: https://generativelanguage.googleapis.com/v1beta/openai
      # api_key_env: GEMINI_API_KEY
      #
      interval_s: 8.0 # seconds between judgments (async worker; never blocks the camera loop).
      # 8s keeps the free Gemini tier under its requests-per-minute cap; drop to 4.0 on a paid key.
      burst_frames: 3 # frames per judgment, captured burst_spacing_s apart. A single frame can't
      # distinguish a blink from a microsleep or a mirror check from a stare; a short burst can.
      # Costs ~burst_frames x the image tokens per judgment. Set to 1 for the original single-frame mode.
      burst_spacing_s: 0.7 # seconds between the frames of one burst (temporal context window ~1.4s at 3 frames)
      min_confidence: 0.7 # verdicts below this confidence can never confirm an alert
      confirm_judgments: 2 # consecutive dangerous verdicts required -> worst-case ~2*interval_s to a confirmed alert
      jpeg_quality: 80 # in-memory JPEG encode quality for the judged frame
      max_consecutive_failures: 5 # API errors in a row before the judge disables itself for this run

  alerts:
    sinks: [console, sound] # no gpio_buzzer -- this profile only ever runs on a Mac
    cooldown_s: 10 # spec: 10s cooldown per alert type for this profile (pi profile uses 15s -- unaffected)
    loud_types: [drowsiness, eyes_down, phone_use_while_distracted, fatigue_critical,
                 vlm_confirmed_drowsiness, vlm_confirmed_distraction, vlm_confirmed_phone_use]
    soft_types: [microsleep_warning, phone_in_hand, eating_drinking, eyes_off_road, excessive_glancing, fatigue,
                 vlm_confirmed_eating]
