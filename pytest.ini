# Minimal pytest configuration.
#
# WHY THIS FILE EXISTS AT ALL
# ---------------------------
# It would have been possible to pass every one of these as a flag from the
# Makefile. It is here instead because the settings below must hold for ANY
# invocation — a developer typing `pytest -k fall`, the pre-commit hook, and CI
# — not only for the one path that goes through `make test`. A deadlock guard
# that only applies when you remember the flag is not a guard.
#
# It is deliberately NOT a pyproject.toml. This project uses a flat layout
# (core/, modules/, services/ imported by name from the repo root; see
# tests/conftest.py). A pyproject.toml makes the directory look like a packaged
# project to pip/uv/pytest and risks changing import resolution, for a project
# that is never packaged.
#
# Collection scope is intentionally left at pytest's default (no `testpaths`).
# Bare `pytest` currently collects 1145 tests: 1142 from tests/ plus 3 from
# third_party/DashSentinel/tests, the vendored repo's own suite. Those 3 are
# worth keeping — they are the check that the vendored copy still behaves like
# the upstream it is supposed to reproduce. Setting `testpaths = tests` would
# have silently dropped them and changed what `make test` means.

[pytest]

# The full suite runs in ~18 seconds. Anything that takes 60s is not slow, it is
# stuck: a thread that never joins, a socket read with no timeout, a watchdog
# loop waiting on a device that is not there. This codebase is full of exactly
# those shapes (services/supervisor.py, core/uplink.py, services/ble_gatt.py),
# and without a per-test timeout a single hang burns the entire CI job budget
# and reports nothing useful.
#
# `thread` method rather than `signal`: the signal method cannot interrupt a
# test blocked inside a C extension, which is where opencv/mediapipe/onnxruntime
# calls spend their time.
timeout = 60
timeout_method = thread

# --durations=10 shows the slowest 10 tests: cheap, and it is how a creeping
# regression in suite time gets noticed before it becomes a two-minute CI step.
#
# --strict-markers turns a typo'd marker into an error instead of a test that
# silently never runs under `-m`. Safe to switch on today: `parametrize` (6
# uses) is the only marker anywhere in the suite, and it is built in. Register
# any new custom marker under [pytest] markers = below.
addopts = --durations=10 --strict-markers
