          metric: inference_latency_ms_mean
          value: 293.1
          evidence: docs/PERFORMANCE_BUDGET.md (CPU column; why the device moved to the NPU)
    licence:
      code: AGPL-3.0
      weights: AGPL-3.0
      training_data: COCO train2017
      commercial_status: restricted
      notes: >-
        AGPL-3.0 (Ultralytics' own position covers models and weights). Kept in
        requirements.txt for developer machines only; absent from
        requirements-device.txt. Must never be `shipping` -- validation refuses it.
    evaluation:
      status: unevaluated
      evidence: []
    known_limitations:
      - Development and CI fallback only; numbers measured on it do not describe the shipped detector
    deployment: dev_only

  # ---------------------------------------------------------------- candidate
  - id: damo_yolo_t_exp08_person_phone_hand
    version: "exp08-unreleased"
    family: damo-yolo
    task: object_detection
    artifacts: []
    classes:
      - {source: person, index: 0, label: person, capability: objects}
      - {source: phone, index: 1, label: cell phone, capability: objects}
      - {source: hand, index: 2, label: hand, capability: hands}
    provides_capabilities: [objects, hands]
    compute:
      targets: [hailo8l]
      published_fps: []
      measured: []
    licence:
      code: Apache-2.0
      weights: Apache-2.0 base checkpoint (damoyolo_tinynasL20_T_420.pth); fine-tuned weights not yet produced
      training_data: >-
        Open Images V7 subset oi7-sd-v1 train split (manifest b878e8429d221f3f;
        annotations CC BY 4.0, images CC BY 2.0 verified per file) on top of the
        COCO-trained base checkpoint
      commercial_status: unreviewed
      notes: Licence review of the fine-tuned weights is required before this can move past candidate
    evaluation:
      status: unevaluated
      evidence: []
    known_limitations:
      - EXP-08a pilot authorised (docs/research/FINETUNE_EXP08_SPEC.md on feat/m4-detector-baseline); full campaign EXP-08b not approved
      - Hand boxes are not MediaPipe landmarks; consumers of `hands` would need adapting
      - No Hailo compile, no NoIR calibration set, no Pi validation
    deployment: candidate
