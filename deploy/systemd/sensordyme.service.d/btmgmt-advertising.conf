# OPTIONAL drop-in for deploy/systemd/sensordyme.service.hardened. PREPARED, NOT INSTALLED.
#
# Only for controllers where bluetoothd's own advertising manager fails (the Pi 5's
# CYW43455, see services/ble_gatt.py) and BLE provisioning therefore falls back to
# `btmgmt` on the kernel mgmt socket. That socket needs CAP_NET_ADMIN and
# AF_BLUETOOTH. Under the stock unit the same grant is sudo for five exact btmgmt
# command lines; under NoNewPrivileges sudo cannot work, so this is the
# replacement.
#
# TRADE-OFF (read before installing): an ambient capability belongs to the whole
# service process, not to btmgmt alone. CAP_NET_ADMIN lets a compromised service
# reconfigure interfaces, routes and firewall rules, which the five sudoers lines
# never allowed. Without this drop-in, a Pi 5 under the hardened unit cannot
# advertise over BLE at all (provisioning by BLE fails closed; Wi-Fi already
# joined keeps working). docs/LEAST_PRIVILEGE.md lists the narrower alternative
# (a root oneshot unit that only advertises) as follow-up work.
#
# Install as /etc/systemd/system/sensordyme.service.d/btmgmt-advertising.conf.
[Service]
CapabilityBoundingSet=CAP_NET_ADMIN
AmbientCapabilities=CAP_NET_ADMIN
RestrictAddressFamilies=AF_BLUETOOTH
